apiVersion: apps/v1
kind: Deployment
metadata:
  name: reimbursement-frontend
  namespace: reimbursement
  labels:
    app: reimbursement-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reimbursement-frontend
  template:
    metadata:
      labels:
        app: reimbursement-frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/dishalalwani/reimbursement-frontend:b044bce
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
